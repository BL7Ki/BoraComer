name: bora-comer

services:
  h2:
    image: oscarfonts/h2
    ports:
      - "1521:1521"
      - "81:81"
    environment:
      H2_OPTIONS: "-tcp -tcpAllowOthers -web -webAllowOthers"
    volumes:
      - h2_data:/opt/h2-data

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "${RABBIT_PORT:-5672}:5672"
      - "${RABBIT_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-bora}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-comer}
      RABBITMQ_DEFAULT_VHOST: ${RABBIT_VHOST:-/bora}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bora-comer-app:dev
    depends_on:
      - h2
      - rabbitmq
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: ${RABBIT_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBIT_USER:-bora}
      SPRING_RABBITMQ_PASSWORD: ${RABBIT_PASS:-comer}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBIT_VHOST:-/bora}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  h2_data:
  rabbitmq_data:
